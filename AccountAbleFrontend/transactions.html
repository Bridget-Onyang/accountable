<!DOCTYPE html>
<html>
<head><title>Transactions</title></head>
<body>
  <form id="transaction-form">
    <input type="number" id="amount" placeholder="Amount" required /><br />
    <input type="text" id="description" placeholder="Description" required /><br />
    <button type="submit">Submit Transaction</button>
  </form>
  <script>
    document.getElementById("transaction-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const token = localStorage.getItem("token");
      const data = {
        amount: document.getElementById("amount").value,
        description: document.getElementById("description").value
      };
      const res = await fetch("http://127.0.0.1:5000/transaction/create", {
        method: "POST",
        headers: {
          "Authorization": `Bearer ${token}`,
          "Content-Type": "application/json"
        },
        body: JSON.stringify(data)
      });
      const result = await res.json();
      alert(result.message || "Transaction added.");
    });
  </script>
</body>
</html>
